# IDEA mode: registers the IDEA agent preset and/or a Host-level IDEA MCP
# server at runtime, driven by the three live settings on the row below.
#
# This file used to insert a static `preset-idea` row carrying all of the
# preset's plugin list. It does not any more: which mode is registered — neither,
# a dedicated preset, or Host-level tools — is a runtime decision the plugin
# makes from its own configuration, so the row list moved into `lib/preset.js`
# where the configured MCP address can be spliced into it.
- insert:
    - id: idea-mode
      name: 'dsh-idea-mode'
      config:
        # Address the JetBrains IDEA MCP server listens on. Set process env
        # IDEA_MCP_URL to change the default without editing this file.
        mcpUrl: !!js "process.env.IDEA_MCP_URL ?? 'http://127.0.0.1:64342/stream'"
        # Both modes default to off: installing the bundle registers nothing
        # until one is switched on from the plugin's configuration page.
        registerPreset: false
        registerIntoStandard: false
